{% extends "base.html" %}

{% block title %}Delete "{{ book.title }}" — LibraryApp{% endblock %}

{% block content %}
<div class="container">
  <div class="confirm-box">
    <h1>Delete Book</h1>
    <p>Are you sure you want to delete <strong>{{ book.title }}</strong>? This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <div class="book-actions">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'book_detail' book.pk %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
